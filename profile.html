<!DOCTYPE html>
<html>
<head>
  <title>My Profile</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="profile-body">

<script>
  if (!localStorage.getItem("currentUser")) {
    alert("Please login first");
    window.location.href = "login.html";
  }
</script>

<div class="profile-card">
  <h2>My Profile</h2>

  <!-- ================= VIEW MODE ================= -->
  <div id="viewProfile" style="display: block;">

    <div style="display: flex; align-items: center; margin: 10px 0;">
      <label style="width: 100px; text-align: right; margin-right: 10px;">
        <b>Name:</b>
      </label>
      <span id="vname"
        style="flex: 1; padding: 5px; background: #f5f5f5; border-radius: 4px;">
        Loading...
      </span>
    </div>

    <div style="display: flex; align-items: center; margin: 10px 0;">
      <label style="width: 100px; text-align: right; margin-right: 10px;">
        <b>Phone No:</b>
      </label>
      <span id="vphone"
        style="flex: 1; padding: 5px; background: #f5f5f5; border-radius: 4px;">
        Loading...
      </span>
    </div>

    <div style="display: flex; align-items: center; margin: 10px 0;">
      <label style="width: 100px; text-align: right; margin-right: 10px;">
        <b>Address:</b>
      </label>
      <span id="vaddress"
        style="flex: 1; padding: 5px; background: #f5f5f5; border-radius: 4px;">
        Loading...
      </span>
    </div>

    <button onclick="editMyProfile()" style="width: 100%; margin-top: 20px;">
      Edit Profile
    </button>
  </div>

  <!-- ================= EDIT MODE ================= -->
  <div id="editProfile" style="display:none; margin-top:20px;">

    <div style="display: flex; align-items: center; margin: 10px 0;">
      <label style="width: 100px; text-align: right; margin-right: 10px;">
        Name:
      </label>
      <input id="pname" type="text" style="flex: 1;">
    </div>

    <div style="display: flex; align-items: center; margin: 10px 0;">
      <label style="width: 100px; text-align: right; margin-right: 10px;">
        Phone No:
      </label>
      <input id="pphone" type="text" style="flex: 1;">
    </div>

    <!-- 🔴 ADDRESS FIELD (REQUIRED) -->
    <div style="display: flex; align-items: center; margin: 10px 0;">
      <label style="width: 100px; text-align: right; margin-right: 10px;">
        Address:
      </label>
      <input id="paddress" type="text" style="flex: 1;">
    </div>

    <button onclick="saveEditedProfile()" style="width: 48%; margin-top: 10px;">
      Save
    </button>

    <button onclick="cancelEditProfile()" style="width: 48%; margin-top: 10px;">
      Back
    </button>

    <p id="pmsg" class="msg"></p>
  </div>

</div>

<script src="script.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    loadViewProfile();
  });
</script>

</body>
</html>
