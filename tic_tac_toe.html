<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      background: linear-gradient(135deg, #667eea, #764ba2);
      overflow: hidden;
      transition: background 1s ease;
    }

    /* faint board background */
    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: url('https://upload.wikimedia.org/wikipedia/commons/3/32/Tic_tac_toe.svg') no-repeat center center;
      background-size: contain;
      opacity: 0.07;
      z-index: 0;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 40px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
      z-index: 1;
      animation: fadeIn 0.7s ease;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2em;
      color: #f9f9f9;
    }

    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background-color: #ff9f43;
      color: white;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background-color: #ffbe76;
      color: #2f3640;
      transform: scale(1.05);
    }

    #difficulty {
      display: none;
    }

    #difficulty button {
      background-color: #45a29e;
    }

    #game-board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
      justify-content: center;
      margin: 20px auto;
    }

    .cell {
      background: rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5em;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    .cell:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    #status {
      font-weight: bold;
      margin-top: 10px;
      font-size: 1.1em;
    }

    .options {
      margin-top: 20px;
    }

    .hidden {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Home Screen -->
  <div class="container" id="home-screen">
    <h1>Tic Tac Toe</h1>
    <button onclick="startVsPlayer()">Play vs Player</button>
    <button onclick="showDifficulty()">Play vs Computer</button>
    <div id="difficulty">
      <button onclick="startGame('easy')">Easy</button>
      <button onclick="startGame('medium')">Medium</button>
      <button onclick="startGame('hard')">Hard</button>
    </div>
  </div>

  <!-- Game Screen -->
  <div class="container hidden" id="game-screen">
    <h1 id="mode-title"></h1>
    <div id="game-board"></div>
    <p id="status"></p>
    <div class="options">
      <button id="play-again" class="hidden" onclick="resetGame()">Play Again</button>
      <button id="go-home" class="hidden" onclick="goHome()">Go to Home</button>
    </div>
  </div>

  <script>
    const homeScreen = document.getElementById("home-screen");
    const difficultyDiv = document.getElementById("difficulty");
    const gameScreen = document.getElementById("game-screen");
    const boardEl = document.getElementById("game-board");
    const statusEl = document.getElementById("status");
    const playAgainBtn = document.getElementById("play-again");
    const goHomeBtn = document.getElementById("go-home");
    const modeTitle = document.getElementById("mode-title");

    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let gameActive = true;
    let vsComputer = false;
    let difficulty = "easy";

    // Start vs Player
    function startVsPlayer() {
      vsComputer = false;
      startGame();
    }

    // Show difficulty options
    function showDifficulty() {
      difficultyDiv.style.display = difficultyDiv.style.display === "block" ? "none" : "block";
    }

    // Start Game
    function startGame(level) {
      if (level) {
        difficulty = level;
        vsComputer = true;
      }
      homeScreen.classList.add("hidden");
      gameScreen.classList.remove("hidden");
      modeTitle.textContent = vsComputer
        ? `You vs Computer (${difficulty.toUpperCase()})`
        : "2 Players Mode";
      document.body.style.background = "linear-gradient(135deg, #11998e, #38ef7d)";
      createBoard();
    }

    // Create Game Board
    function createBoard() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      gameActive = true;
      playAgainBtn.classList.add("hidden");
      goHomeBtn.classList.add("hidden");
      boardEl.innerHTML = "";
      statusEl.textContent = "Player X's Turn";

      for (let i = 0; i < 9; i++) {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.dataset.index = i;
        cell.addEventListener("click", handleClick);
        boardEl.appendChild(cell);
      }
    }

    function handleClick(e) {
      const index = e.target.dataset.index;
      if (!gameActive || board[index] !== "") return;
      board[index] = currentPlayer;
      e.target.textContent = currentPlayer;

      if (checkWin()) {
        statusEl.textContent = `Player ${currentPlayer} Wins! 🎉`;
        endGame();
        return;
      }

      if (!board.includes("")) {
        statusEl.textContent = "It's a Draw! 😅";
        endGame();
        return;
      }

      currentPlayer = currentPlayer === "X" ? "O" : "X";
      statusEl.textContent = `Player ${currentPlayer}'s Turn`;

      if (vsComputer && currentPlayer === "O" && gameActive) {
        setTimeout(computerMove, 600);
      }
    }

    function computerMove() {
      let move;
      if (difficulty === "easy") {
        move = randomMove();
      } else if (difficulty === "medium") {
        move = mediumMove();
      } else {
        move = bestMove();
      }

      const cell = document.querySelector(`.cell[data-index='${move}']`);
      board[move] = "O";
      cell.textContent = "O";

      if (checkWin()) {
        statusEl.textContent = "Computer Wins! 🤖";
        endGame();
        return;
      }

      if (!board.includes("")) {
        statusEl.textContent = "It's a Draw! 😅";
        endGame();
        return;
      }

      currentPlayer = "X";
      statusEl.textContent = "Player X's Turn";
    }

    function randomMove() {
      const available = board.map((v, i) => (v === "" ? i : null)).filter(i => i !== null);
      return available[Math.floor(Math.random() * available.length)];
    }

    function mediumMove() {
      // 50% chance of random move, 50% chance of best move
      return Math.random() < 0.5 ? randomMove() : bestMove();
    }

    function bestMove() {
      let bestScore = -Infinity;
      let move;
      for (let i = 0; i < 9; i++) {
        if (board[i] === "") {
          board[i] = "O";
          let score = minimax(board, 0, false);
          board[i] = "";
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move;
    }

    const scores = { X: -1, O: 1, tie: 0 };

    function minimax(boardState, depth, isMaximizing) {
      const winner = checkWinnerMinimax(boardState);
      if (winner !== null) return scores[winner];

      if (isMaximizing) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (boardState[i] === "") {
            boardState[i] = "O";
            let score = minimax(boardState, depth + 1, false);
            boardState[i] = "";
            best = Math.max(score, best);
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (boardState[i] === "") {
            boardState[i] = "X";
            let score = minimax(boardState, depth + 1, true);
            boardState[i] = "";
            best = Math.min(score, best);
          }
        }
        return best;
      }
    }

    function checkWinnerMinimax(b) {
      const wins = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (let combo of wins) {
        const [a,b1,c] = combo;
        if (b[a] && b[a] === b[b1] && b[a] === b[c]) return b[a];
      }
      if (!b.includes("")) return "tie";
      return null;
    }

    function checkWin() {
      const wins = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      return wins.some(combo => {
        const [a,b,c] = combo;
        return board[a] && board[a] === board[b] && board[a] === board[c];
      });
    }

    function endGame() {
      gameActive = false;
      playAgainBtn.classList.remove("hidden");
      goHomeBtn.classList.remove("hidden");
    }

    function resetGame() {
      createBoard();
    }

    function goHome() {
      gameScreen.classList.add("hidden");
      homeScreen.classList.remove("hidden");
      difficultyDiv.style.display = "none";
      document.body.style.background = "linear-gradient(135deg, #667eea, #764ba2)";
    }
  </script>
</body>
</html>
